[package]
name = "dot-matrix"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3"
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.34.3"
egui = "0.34.3"
ringbuf = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.4", features = ["derive"] }
cpal = "0.18.1"
rand = "0.9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
console_error_panic_hook = "0.1"
cpal = { version = "0.18.1", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Node",
    "Storage",
    "Window",
] }
